[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "azenhasoft-fraude-bancaria-ml"
version = "1.0.0"
description = "Projeto conceitual de detecção de fraudes com dados sintéticos"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "azenhasoft"}]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.packages.find]
include = ["fraude*"]
